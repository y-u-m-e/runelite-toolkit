plugins {
    id 'java-library'
}

repositories {
    mavenLocal {
        content {
            excludeGroupByRegex('org\\.lwjgl.*')
        }
    }
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex('net\\.runelite.*')
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    // Everything the toolkit uses comes with the RuneLite client: the client API, Gson,
    // Guice/javax.inject and SLF4J. Lombok is compile-time only. Nothing else is allowed,
    // because the toolkit is vendored into Plugin Hub plugins.
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'sh.yumekui'
version = '0.2.0'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
